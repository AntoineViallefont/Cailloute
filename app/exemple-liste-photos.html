<!doctype html><html lang="fr" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exemple de lieu avec photos — Cailloute</title><link rel="stylesheet" href="/src/style.css"><style>body{margin:0;padding:24px;display:block}main{max-width:640px;margin:auto}h1{margin-bottom:12px}.demo-note{color:var(--muted);margin-bottom:24px}.explanation{margin-top:20px;color:var(--muted);font-size:14px;line-height:1.6}</style><main><h1>À proximité</h1><p class="demo-note">Exemple visuel · données fictives</p><article class="place-row"><button class="place-open"><span class="category-badge" style="background:#009578;color:white" id="category"></span><span class="place-text"><strong>Place Ollier</strong><span class="place-reputation"><span id="rating"></span><span class="accuracy-icon accuracy-valid" role="img" aria-label="Lieu validé" id="verified"></span><span title="Photos disponibles" aria-label="Photos disponibles" id="photos"></span></span><small>450 m · Aire de jeux</small></span></button><button class="icon-button show-on-map" aria-label="Voir sur la carte" id="map"></button><button class="icon-button favorite" aria-label="Ajouter aux favoris" id="heart"></button></article><p class="explanation">L’icône de photos, à droite du symbole de validation, indique que le lieu possède des photos.</p></main><script type="module">import React from 'react';import{createRoot}from'react-dom/client';import{Images,CircleCheck,Star,Map,Heart,FerrisWheel}from'lucide-react';for(const[id,icon,size]of[['category',FerrisWheel,21],['verified',CircleCheck,20],['photos',Images,16],['map',Map,21],['heart',Heart,21]])createRoot(document.getElementById(id)).render(React.createElement(icon,{size}));createRoot(document.getElementById('rating')).render(React.createElement(React.Fragment,null,React.createElement(Star,{size:14,className:'star',fill:'currentColor'}),' 4,5/5 · 2 avis'));</script></html>
